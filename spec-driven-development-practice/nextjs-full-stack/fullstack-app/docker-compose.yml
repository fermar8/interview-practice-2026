services:
  postgres:
    image: postgres:16-alpine
    container_name: slot-reservation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: slot_reservations
    ports:
      - "55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slot_reservations"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
